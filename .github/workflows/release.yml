name: Release

# Tags the next version and cuts a GitHub Release on every push to main.
# The version is stamped into the packaged fxmanifest.lua only; nothing is committed
# back to main, so main's history stays free of release bumps.

on:
  push:
    branches: [main]

permissions:
  contents: write

# One release at a time: overlapping runs would compute the same next version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Reads commit messages since the last tag to pick the next version
      # (#major / #minor bump it up; anything else is a patch bump) and tags this commit.
      - name: Tag next version
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build UI
        working-directory: web
        run: npm ci && npm run build

      # Only what the server needs to run: no web source, node_modules, tests or docs.
      # The folder name is the resource name, so it unzips straight into resources/.
      - name: Package resource
        run: |
          mkdir -p pkg/kora_phone/web
          cp -r fxmanifest.lua README.md qbphone.sql client config server shared migrations local-media integration pkg/kora_phone/
          cp -r web/dist pkg/kora_phone/web/
          sed -i "s/^version '.*'/version '${{ steps.tag.outputs.new_version }}'/" pkg/kora_phone/fxmanifest.lua
          cd pkg && zip -r ../kora_phone-${{ steps.tag.outputs.new_tag }}.zip kora_phone

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}
          files: kora_phone-${{ steps.tag.outputs.new_tag }}.zip
