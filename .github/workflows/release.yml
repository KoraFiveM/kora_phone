name: Release

# Tags the next version and cuts a GitHub Release on every push to dev.
# The version is stamped into the packaged fxmanifest.lua (never committed back to dev: see the stamp step).

on:
  push:
    branches: [dev]

permissions:
  contents: write

# One release at a time: overlapping runs would compute the same next version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: kora-vps
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Lua
        run: command -v lua5.4 >/dev/null || sudo apt-get install -y lua5.4

      # Two sibling resources are needed, both expected under the server's resources/ tree (three levels above web/):
      #  - [standalone]/kora_theme: web/vite.config.ts imports its vite plugin (tests run tsc, and the UI build uses it).
      #  - [pre]/kora_lib: tests/animations.test.lua loads the real kora_lib config validator.
      # actions/checkout cannot write outside the workspace, so clone them to those exact spots.
      - name: Checkout sibling resources (kora_theme, kora_lib)
        run: |
          base="$(cd "$GITHUB_WORKSPACE/../.." && pwd)"
          token="${{ secrets.KORA_THEME_TOKEN || secrets.GITHUB_TOKEN }}"
          owner="${{ github.repository_owner }}"
          for entry in "[standalone]/kora_theme" "[pre]/kora_lib"; do
            dir="$base/$entry"
            rm -rf "$dir"
            git clone --depth 1 "https://x-access-token:${token}@github.com/${owner}/${entry##*/}.git" "$dir"
          done

      - name: Install dependencies
        run: (cd sdk && npm ci) && (cd web && npm ci)

      # Lua + Node contract tests, the print guard, SDK tests and the web typecheck. A failure stops the release
      # before anything is tagged or packaged.
      - name: Run tests
        run: LUA=lua5.4 bash test/run.sh

      # Reads commit messages since the last tag to pick the next version
      # (#major / #minor bump it up; anything else is a patch bump) and tags this commit.
      - name: Tag next version
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

      # Stamp the new version into the manifest that gets packaged. It is NOT committed back: the "Protect main & dev"
      # ruleset requires a pull request for every change to dev, so a direct push from this job is rejected (that
      # failed the release before any zip was built). The tag and the release zip carry the version; the
      # `version` field in the repository's fxmanifest.lua is only a development placeholder.
      - name: Stamp version into fxmanifest.lua (packaged copy only)
        run: |
          sed -i "s/^version '.*'/version '${{ steps.tag.outputs.new_version }}'/" fxmanifest.lua
          grep -n "^version" fxmanifest.lua

      - name: Build UI
        working-directory: web
        run: npm run build

      # Include runtime files, built UI, and docs. Exclude web source, node_modules, and tests.
      # The folder name is the resource name, so it unzips straight into resources/.
      - name: Package resource
        run: |
          mkdir -p pkg/kora_phone/web
          cp -r fxmanifest.lua README.md LICENSE docs client config server shared locales local-media stream pkg/kora_phone/
          sed -i '/^[[:blank:]]*qa_feature[[:blank:]]/d' pkg/kora_phone/fxmanifest.lua
          test -f pkg/kora_phone/stream/kora_phone_props.ytyp
          test -f web/dist/index.html
          cp -r web/dist pkg/kora_phone/web/
          cd pkg && zip -r ../kora_phone-${{ steps.tag.outputs.new_tag }}.zip kora_phone

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}
          files: kora_phone-${{ steps.tag.outputs.new_tag }}.zip
