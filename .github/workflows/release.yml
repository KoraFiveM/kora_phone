name: Release

# Tags the next version and cuts a GitHub Release on every push to main.
# The version is stamped into fxmanifest.lua, committed back to main ([skip ci]) and packaged.

on:
  push:
    branches: [main]

permissions:
  contents: write

# One release at a time: overlapping runs would compute the same next version.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Reads commit messages since the last tag to pick the next version
      # (#major / #minor bump it up; anything else is a patch bump) and tags this commit.
      - name: Tag next version
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

      - name: Bump fxmanifest.lua version
        run: |
          sed -i "s/^version '.*'/version '${{ steps.tag.outputs.new_version }}'/" fxmanifest.lua
          if ! git diff --quiet fxmanifest.lua; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add fxmanifest.lua
            git commit -m "chore: bump version to ${{ steps.tag.outputs.new_version }} [skip ci]"
            git push origin HEAD:main
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build UI
        working-directory: web
        run: npm ci && npm run build

      # Only what the server needs to run: no web source, node_modules, tests or docs.
      # The folder name is the resource name, so it unzips straight into resources/.
      - name: Package resource
        run: |
          mkdir -p pkg/kora_phone/web
          cp -r fxmanifest.lua README.md client config server shared local-media integration pkg/kora_phone/
          cp -r web/dist pkg/kora_phone/web/
          cd pkg && zip -r ../kora_phone-${{ steps.tag.outputs.new_tag }}.zip kora_phone

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}
          files: kora_phone-${{ steps.tag.outputs.new_tag }}.zip
