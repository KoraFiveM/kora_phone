name: Release

# Bumps the version, tags it, and cuts a GitHub Release on every push to main.
# Skips its own bump commit (tagged [skip ci]) so it doesn't trigger itself again.

on:
  push:
    branches: [main]

permissions:
  contents: write

# One release at a time: overlapping runs would each bump from a stale checkout.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # not the triggering SHA: an earlier run may have pushed a bump since
          fetch-depth: 0

      # Reads commit messages since the last tag to pick the next version
      # (#major / #minor bump it up; anything else is a patch bump), without
      # creating the tag yet -- fxmanifest.lua needs to carry that version first.
      - name: Compute next version
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          dry_run: true

      - name: Bump fxmanifest.lua version
        run: |
          sed -i "s/^version '.*'/version '${{ steps.tag.outputs.new_version }}'/" fxmanifest.lua
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add fxmanifest.lua
          git commit -m "chore: release ${{ steps.tag.outputs.new_tag }} [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Tag the release commit
        run: |
          git tag ${{ steps.tag.outputs.new_tag }}
          git push origin ${{ steps.tag.outputs.new_tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # web/vite.config.ts imports the qbtheme plugin from a sibling checkout.
      - name: Fetch qbtheme
        run: git clone --depth 1 https://github.com/qbcore2/qbtheme ../qbtheme

      - name: Build UI
        working-directory: web
        run: npm ci && npm run build

      # Only what the server needs to run: no web source, node_modules, tests or docs.
      # The folder name is the resource name, so it unzips straight into resources/.
      - name: Package resource
        run: |
          mkdir -p pkg/qbphone/web
          cp -r fxmanifest.lua README.md client config server shared migrations local-media pkg/qbphone/
          cp -r web/dist pkg/qbphone/web/
          cd pkg && zip -r ../qbphone-${{ steps.tag.outputs.new_tag }}.zip qbphone

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}
          files: qbphone-${{ steps.tag.outputs.new_tag }}.zip
