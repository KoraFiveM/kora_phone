name: Release

# Bumps the version, tags it, and cuts a GitHub Release on every push to main.
# Skips its own bump commit (tagged [skip ci]) so it doesn't trigger itself again.

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Reads commit messages since the last tag to pick the next version
      # (#major / #minor bump it up; anything else is a patch bump), without
      # creating the tag yet -- fxmanifest.lua needs to carry that version first.
      - name: Compute next version
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          dry_run: true

      - name: Bump fxmanifest.lua version
        run: |
          sed -i "s/^version '.*'/version '${{ steps.tag.outputs.new_version }}'/" fxmanifest.lua
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add fxmanifest.lua
          git commit -m "chore: release ${{ steps.tag.outputs.new_tag }} [skip ci]"
          git push origin HEAD:main

      - name: Tag the release commit
        run: |
          git tag ${{ steps.tag.outputs.new_tag }}
          git push origin ${{ steps.tag.outputs.new_tag }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          name: ${{ steps.tag.outputs.new_tag }}
          body: ${{ steps.tag.outputs.changelog }}
