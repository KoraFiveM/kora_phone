name: Bug report
description: Report something that is not working in kora_phone.
title: '[Bug]: '
labels:
  - bug
  - needs-triage
body:
  - type: markdown
    attributes:
      value: >-
        Search existing issues first and report one problem at a time. Remove passwords, tokens,
        connection strings and player identifiers from text and attachments. For a suspected
        vulnerability, use the repository Security tab or its security policy instead of a public
        issue.
  - type: dropdown
    id: version
    attributes:
      label: Resource version
      description: >-
        Select your installed kora_phone version (check fxmanifest.lua if unsure). For a development
        build or another version, add the version/commit under Technical details.
      options:
        - v0.0.1-dev.4
        - v0.0.1-dev.3
        - v0.0.1-dev.2
        - v0.0.1-dev.1
        - Development / unreleased
        - Other version
        - Unknown
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part is affected?
      options:
        - Handset interfaces
        - SIM identity
        - Contacts and communication
        - Cloud recovery
        - Other / not sure
  - type: textarea
    id: problem
    attributes:
      label: Describe the issue in detail.
      description: >-
        Describe what happens in kora_phone. Name the handset and app, SIM state and failed action.
        For calls, include the voice resource; never share real messages, phone numbers or PINs.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant F8 error or log (optional)
      description: >-
        Provide F8/client or server console errors and say which console they came from. Remove
        secrets and player data.
      render: text
  - type: textarea
    id: steps
    attributes:
      label: What are the steps to reproduce the issue?
      description: >-
        List what you did in order, including any required job, items or location. If it happens
        only sometimes, say how often and whether it follows a reconnect or resource restart.
      placeholder: |-
        1. Join the server and load your character.
        2. Open the affected phone app with the same handset and SIM state, then repeat the failing action.
        3. Describe what happens and when the issue starts.
    validations:
      required: true
  - type: textarea
    id: expected_behavior
    attributes:
      label: What is the expected behavior?
      description: >-
        Explain what kora_phone should do when you follow those steps, including any expected
        changes to the player, UI or server state.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Technical details (optional)
      description: >-
        Include your exact version/commit if you selected a development build or another version,
        FXServer artifact/game build, relevant dependency versions and custom changes if known. Do
        not paste your full server.cfg.
  - type: textarea
    id: media
    attributes:
      label: Screenshots or video (optional)
      description: >-
        Drag in an image or add a clip link if it helps show the problem. Check attachments for
        private information.
